<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <title>Kairos</title>
</head>
<body>
    <video autoplay muted loop class="back-video">
        <source src="background vid.mp4" type="video/mp4">
    </video>
    <div class="head">
        <header>
            <div class="logo">
                <img src="img/Kairos logo.png" alt="">
            </div>
            <div class="nav">
                <div class="nav-elem">
                    HOME
                </div>
                <div class="nav-elem">
                    ABOUT US
                </div>
                <div class="nav-elem">
                    PROJECTS
                </div>
                <div class="nav-elem" style="border: none;">
                    CONTACT US
                </div>
            </div>
        </header>
        <article class="vid-art">
            <div class="vid-art-text">
                <div style="margin-bottom: 40px; width: 933px; font-size: 96px; text-transform: uppercase;">
                    From the Field of All Possibility
                </div>
                <div style="width: 1016px; font-size: 18px;">
                    This is an emergent space where ideas are not created, 
                    but carefully discovered. We navigate the vast potential 
                    to bring forth only the most resonant patterns and coherent forms. 
                    Here, the future is curated from the infinite.
                </div>
                <div class="vid-btns">
                    <button type="button" class="vid-btn" id="vid-btn-1">
                        <span class="vid-btn-text">Learn More</span>
                        <span class="vid-btn-icon-1">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14"></path>
                                <path d="M12 5l7 7-7 7"></path>
                            </svg>
                        </span>
                    </button>
                    <button type="button" class="vid-btn" id="vid-btn-2">
                        <span class="vid-btn-text">Play Video</span>
                        <span class="vid-btn-icon-2">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                        </span>
                    </button>
                </div>
            </div>
        </article>
    </div>
</body>
</html>
